<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image Viewer — 1920×1080</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0e0e0f;
  --surface: #181819;
  --surface2: #222224;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --accent: #c8f04a;
  --accent-dim: rgba(200,240,74,0.12);
  --text: #f0f0ee;
  --muted: #888884;
  --muted2: #555552;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  backdrop-filter: blur(8px);
}
.logo { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); }
.logo span { color: var(--muted); font-weight: 400; }
.header-right { display: flex; align-items: center; gap: 12px; }
.pill {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface2);
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid var(--border);
}
.pill.active { color: var(--accent); background: var(--accent-dim); border-color: rgba(200,240,74,0.3); }

/* ── TOOLBAR ── */
.toolbar {
  padding: 16px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.btn-folder {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: var(--accent);
  color: #0e0e0f;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.02em;
}
.btn-folder:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-folder:active { transform: scale(0.97); }
#folderInput { display: none; }

select {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}
select:hover { border-color: rgba(200,240,74,0.4); }

.toolbar-sep { width: 1px; height: 28px; background: var(--border); }

.view-toggle { display: flex; gap: 4px; }
.vbtn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 7px;
  padding: 7px 10px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.vbtn:hover { border-color: var(--border2); color: var(--text); }
.vbtn.on { background: var(--accent-dim); border-color: rgba(200,240,74,0.35); color: var(--accent); }

/* ── PROGRESS ── */
#progressWrap {
  padding: 10px 28px;
  display: none;
  align-items: center;
  gap: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.prog-track {
  flex: 1;
  height: 3px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.2s;
  width: 0%;
}

/* ── EMPTY STATE ── */
#emptyState {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 14px;
  color: var(--muted2);
  text-align: center;
  padding: 2rem;
}
.empty-icon {
  width: 72px;
  height: 72px;
  border: 1.5px dashed var(--muted2);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 4px;
}
.empty-title { font-size: 18px; font-weight: 600; color: var(--muted); }
.empty-sub { font-size: 13px; max-width: 280px; line-height: 1.7; }

/* ── MAIN CONTAINER ── */
#gallery { padding: 0; }

/* ── FOLDER SECTION ── */
.folder-section { padding: 24px 28px 28px; border-bottom: 1px solid var(--border); }
.folder-section:last-child { border-bottom: none; }

.folder-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.folder-header-left { display: flex; align-items: center; gap: 10px; }
.folder-icon {
  width: 32px; height: 32px;
  background: var(--accent-dim);
  border: 1px solid rgba(200,240,74,0.25);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.folder-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 400px;
}
.folder-badge {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid rgba(200,240,74,0.25);
  padding: 3px 10px;
  border-radius: 99px;
  white-space: nowrap;
}
.folder-remove {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 11px;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  transition: all 0.15s;
  white-space: nowrap;
}
.folder-remove:hover { border-color: rgba(255,80,80,0.4); color: #ff6b6b; background: rgba(255,80,80,0.07); }

/* ── GRID inside section ── */
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.img-grid.list-view {
  grid-template-columns: 1fr;
  gap: 6px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.18s, transform 0.18s;
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card:hover { border-color: rgba(200,240,74,0.45); transform: translateY(-2px); }
.card:hover .card-overlay { opacity: 1; }
.card:active { transform: scale(0.97); }

.thumb-wrap {
  width: 100%;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: #000;
  position: relative;
}
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
.card:hover .thumb-wrap img { transform: scale(1.04); }
.card-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.42);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.open-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(200,240,74,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-info { padding: 8px 10px 9px; }
.card-name {
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.card-meta {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}
.card-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  float: right;
}

/* List view card */
.list-view .card { display: flex; align-items: center; gap: 0; border-radius: 8px; }
.list-view .thumb-wrap { width: 96px; min-width: 96px; height: 54px; aspect-ratio: unset; flex-shrink: 0; }
.list-view .card-info { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
.list-view .card-name { font-size: 13px; }
.list-view .card-meta { margin: 0; }

/* ── LIGHTBOX ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #000;
  cursor: pointer;
}
#lightbox.open { display: block; }
.lb-main {
  width: 100%;
  height: 100%;
  position: relative;
}
.lb-main img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  transition: opacity 0.18s;
}
.lb-main img.fade { opacity: 0; }
.lb-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 18px;
  user-select: none;
  z-index: 2;
}
.lb-nav:hover { background: rgba(200,240,74,0.25); color: var(--accent); border-color: rgba(200,240,74,0.5); }
.lb-prev { left: 20px; }
.lb-next { right: 20px; }
.lb-counter-badge {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  background: rgba(0,0,0,0.5);
  padding: 4px 12px;
  border-radius: 99px;
  pointer-events: none;
  z-index: 2;
}
.lb-esc-hint {
  position: absolute;
  top: 16px;
  right: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  background: rgba(0,0,0,0.4);
  padding: 3px 10px;
  border-radius: 6px;
  pointer-events: none;
  z-index: 2;
}

canvas { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">IMG<span>VIEWER</span> <span style="font-size:11px; color:var(--muted2); margin-left:4px; font-family:'DM Mono',monospace;">1920×1080</span></div>
  <div class="header-right">
    <div class="pill" id="countPill">0 images</div>
    <div class="pill active">Auto Resize ON</div>
  </div>
</header>

<div class="toolbar">
  <label class="btn-folder" for="folderInput">
    <svg width="15" height="14" viewBox="0 0 15 14" fill="none"><path d="M1 3A1.5 1.5 0 012.5 1.5h3.086a1.5 1.5 0 011.06.44l.915.914A1.5 1.5 0 008.62 3.4H12.5A1.5 1.5 0 0114 4.9V11A1.5 1.5 0 0112.5 12.5h-10A1.5 1.5 0 011 11V3z" fill="currentColor"/></svg>
    Folder Select Karo
  </label>
  <input type="file" id="folderInput" accept="image/*" webkitdirectory multiple/>

  <div style="display:flex;align-items:center;gap:6px;">
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);">FIT:</span>
    <select id="fitMode">
      <option value="fill">Fill (crop)</option>
      <option value="contain">Contain (letterbox)</option>
      <option value="stretch">Stretch</option>
    </select>
  </div>

  <div class="toolbar-sep"></div>

  <div class="view-toggle">
    <button class="vbtn on" id="btnGrid" title="Grid view" onclick="setView('grid')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="1" y="8" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="8" width="5" height="5" rx="1" fill="currentColor"/></svg>
    </button>
    <button class="vbtn" id="btnList" title="List view" onclick="setView('list')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="2.5" rx="1" fill="currentColor"/><rect x="1" y="6" width="12" height="2.5" rx="1" fill="currentColor"/><rect x="1" y="10" width="12" height="2.5" rx="1" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div id="progressWrap">
  <span id="progLabel">Processing…</span>
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
  <span id="progNum" style="white-space:nowrap">0 / 0</span>
</div>

<div id="emptyState">
  <div class="empty-icon">🗂</div>
  <div class="empty-title">Koi folder select nahi hai</div>
  <div class="empty-sub">Upar "Folder Select Karo" dabao — sari images automatically 1920×1080 mein resize ho jaayengi</div>
</div>

<div id="gallery" style="display:none"></div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="handleLbClick(event)">
  <div class="lb-main">
    <img id="lbImg" src="" alt=""/>
    <button class="lb-nav lb-prev" onclick="event.stopPropagation();navigate(-1)">&#8592;</button>
    <button class="lb-nav lb-next" onclick="event.stopPropagation();navigate(1)">&#8594;</button>
    <div class="lb-counter-badge" id="lbCounter">1 / 1</div>
    <div class="lb-esc-hint">ESC — band karo</div>
  </div>
</div>

<canvas id="cvs"></canvas>

<script>
const folderInput = document.getElementById('folderInput');
const gallery = document.getElementById('gallery');
const emptyState = document.getElementById('emptyState');
const progressWrap = document.getElementById('progressWrap');
const progFill = document.getElementById('progFill');
const progNum = document.getElementById('progNum');
const progLabel = document.getElementById('progLabel');
const countPill = document.getElementById('countPill');
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCounter = document.getElementById('lbCounter');

const W = 1920, H = 1080;

// folders = [ { id, name, images: [{name, dataUrl}] } ]
let folders = [];
let lbFolderIdx = 0;
let lbImgIdx = 0;
let currentView = 'grid';

folderInput.addEventListener('change', async () => {
  const files = [...folderInput.files].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;

  // Folder name — webkitRelativePath se
  const folderName = files[0].webkitRelativePath
    ? files[0].webkitRelativePath.split('/')[0]
    : ('Folder ' + (folders.length + 1));

  const folderId = Date.now();
  const folderImages = [];

  emptyState.style.display = 'none';
  gallery.style.display = 'block';
  progressWrap.style.display = 'flex';
  progFill.style.width = '0%';
  folderInput.value = '';

  // Section create karo
  const section = document.createElement('div');
  section.className = 'folder-section';
  section.id = 'folder-' + folderId;
  section.innerHTML = `
    <div class="folder-header">
      <div class="folder-header-left">
        <div class="folder-icon">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="none"><path d="M1 3A1.5 1.5 0 012.5 1.5h3.586a1.5 1.5 0 011.06.44l.915.914A1.5 1.5 0 009.12 3.4H13.5A1.5 1.5 0 0115 4.9V11.5A1.5 1.5 0 0113.5 13h-11A1.5 1.5 0 011 11.5V3z" fill="var(--accent)"/></svg>
        </div>
        <span class="folder-title" title="${folderName}">${folderName}</span>
        <span class="folder-badge" id="badge-${folderId}">0 images</span>
      </div>
      <button class="folder-remove" onclick="removeFolder('${folderId}')">✕ Hatao</button>
    </div>
    <div class="img-grid ${currentView === 'list' ? 'list-view' : ''}" id="grid-${folderId}"></div>
  `;
  gallery.appendChild(section);

  const grid = document.getElementById('grid-' + folderId);
  const badge = document.getElementById('badge-' + folderId);

  for (let i = 0; i < files.length; i++) {
    progLabel.textContent = `${folderName}: ${files[i].name}`;
    progFill.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
    progNum.textContent = `${i + 1} / ${files.length}`;
    await new Promise(r => setTimeout(r, 0));

    const fit = document.getElementById('fitMode').value;
    const dataUrl = await resizeImg(files[i], fit);
    folderImages.push({ name: files[i].name, dataUrl });
    badge.textContent = folderImages.length + ' images';
    addCard(grid, files[i].name, dataUrl, folderImages.length, folderId, folderImages.length - 1);
  }

  folders.push({ id: folderId, name: folderName, images: folderImages });
  updateTotalCount();

  progFill.style.width = '100%';
  progLabel.textContent = 'Done!';
  setTimeout(() => { progressWrap.style.display = 'none'; }, 600);
});

function resizeImg(file, fit) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      cvs.width = W; cvs.height = H;
      ctx.clearRect(0, 0, W, H);
      if (fit === 'stretch') {
        ctx.drawImage(img, 0, 0, W, H);
      } else if (fit === 'contain') {
        const scale = Math.min(W / img.width, H / img.height);
        const nw = img.width * scale, nh = img.height * scale;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(img, (W - nw) / 2, (H - nh) / 2, nw, nh);
      } else {
        const scale = Math.max(W / img.width, H / img.height);
        const nw = img.width * scale, nh = img.height * scale;
        ctx.drawImage(img, (W - nw) / 2, (H - nh) / 2, nw, nh);
      }
      URL.revokeObjectURL(url);
      resolve(cvs.toDataURL('image/jpeg', 0.93));
    };
    img.src = url;
  });
}

function addCard(grid, name, dataUrl, num, folderId, imgIdx) {
  const delay = Math.min((num - 1) * 0.04, 0.6);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = delay + 's';
  card.innerHTML = `
    <div class="thumb-wrap">
      <img src="${dataUrl}" loading="lazy"/>
      <div class="card-overlay">
        <div class="open-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3l5 5-5 5" stroke="#0e0e0f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
    <div class="card-info">
      <span class="card-num">#${num}</span>
      <div class="card-name" title="${name}">${name}</div>
      <div class="card-meta">1920 × 1080 · JPG</div>
    </div>
  `;
  card.onclick = () => openLightbox(folderId, imgIdx);
  grid.appendChild(card);
}

function removeFolder(folderId) {
  folders = folders.filter(f => String(f.id) !== String(folderId));
  const el = document.getElementById('folder-' + folderId);
  if (el) el.remove();
  if (folders.length === 0) {
    gallery.style.display = 'none';
    emptyState.style.display = 'flex';
  }
  updateTotalCount();
}

function updateTotalCount() {
  const total = folders.reduce((s, f) => s + f.images.length, 0);
  countPill.textContent = total + ' images';
}

function openLightbox(folderId, imgIdx) {
  lbFolderIdx = folders.findIndex(f => String(f.id) === String(folderId));
  if (lbFolderIdx === -1) return;
  lbImgIdx = imgIdx;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
  showImage();
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

function handleLbClick(e) {
  if (e.target === lightbox || e.target === lbImg) closeLightbox();
}

function showImage() {
  const folder = folders[lbFolderIdx];
  if (!folder) return;
  const img = folder.images[lbImgIdx];
  lbImg.classList.add('fade');
  setTimeout(() => {
    lbImg.src = img.dataUrl;
    lbImg.classList.remove('fade');
  }, 120);
  lbCounter.textContent = `${folder.name}  ·  ${lbImgIdx + 1} / ${folder.images.length}`;
}

function navigate(dir) {
  const folder = folders[lbFolderIdx];
  if (!folder) return;
  lbImgIdx = (lbImgIdx + dir + folder.images.length) % folder.images.length;
  showImage();
}

function setView(mode) {
  currentView = mode;
  document.querySelectorAll('.img-grid').forEach(g => {
    g.classList.toggle('list-view', mode === 'list');
  });
  if (mode === 'grid') {
    document.getElementById('btnGrid').classList.add('on');
    document.getElementById('btnList').classList.remove('on');
  } else {
    document.getElementById('btnList').classList.add('on');
    document.getElementById('btnGrid').classList.remove('on');
  }
}

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'Escape') closeLightbox();
});
</script>
</body>
</html>
