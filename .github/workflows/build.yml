name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/lib/android-sdk/tools:/usr/lib/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Install Cordova
        run: npm install -g cordova@11

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          export ANDROID_HOME=/usr/lib/android-sdk
          cordova platform add android@11

      - name: Fix Gradle version
        run: |
          find . -name "gradle-wrapper.properties" | xargs sed -i 's|gradle-.*-all.zip|gradle-7.6-all.zip|g' 2>/dev/null || true
          find . -name "gradle-wrapper.properties" | xargs sed -i 's|gradle-.*-bin.zip|gradle-7.6-bin.zip|g' 2>/dev/null || true

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/lib/android-sdk
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: image-viewer-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
